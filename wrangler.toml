name = "spij-mcp"
main = "src/worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Dominio propio (opcional). Requiere que dariomorales.com esté dado de alta
# en Cloudflare (con los nameservers de Cloudflare). Luego:
#   wrangler deploy
# y Cloudflare crea el registro DNS y el certificado de mcp.dariomorales.com.
#
# routes = [
#   { pattern = "mcp.dariomorales.com", custom_domain = true }
# ]

# Sin dominio propio, el Worker queda en:
#   https://spij-mcp.<tu-cuenta>.workers.dev/mcp

# Los secretos se configuran con:
#   wrangler secret put MCP_AUTH_TOKEN
#   wrangler secret put SPIJ_USUARIO     # opcional
#   wrangler secret put SPIJ_CLAVE       # opcional
#
# Variable pública opcional (repositorio para comprobar actualizaciones):
#   [vars]
#   SPIJ_MCP_REPO = "dariodemh/spijmcp"
