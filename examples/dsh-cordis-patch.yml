# Entrada para el perfil de DeepSeek Harness (DSH).
# Archivo: ~/.dsh/profiles/desktop/cordis.patch.yml
# Añade este elemento al array YAML existente (no reemplaces el archivo).
# Después reinicia DSH: las herramientas aparecen como mcp__spij__*.

- id: mcp-spij
  name: "@deepseek-ai/dsh-mcp-client"
  config:
    serverName: spij
    transport: stdio
    command: npx
    args: ["-y", "github:dariodemh/spijmcp"]
    env:
      SPIJ_USUARIO: ""
      SPIJ_CLAVE: ""
    toolCallTimeoutMs: 60000
    reconnect:
      enabled: true

# Alternativa si tienes el servidor remoto desplegado (sección 7 del README):
#
# - id: mcp-spij-remoto
#   name: "@deepseek-ai/dsh-mcp-client"
